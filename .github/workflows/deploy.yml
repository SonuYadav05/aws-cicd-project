name: Deploy Simple Website

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run Unit Tests
        run: npm test

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: DAST Security Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: https://sonuyadav05.github.io/aws-cicd-project/